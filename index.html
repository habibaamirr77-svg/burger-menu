<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Monte seu lanche</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍔</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <div class="hd">
      <h1 id="ttl"></h1>
      <div class="lang">
        <button id="l-ar" data-l="ar">عربي</button>
        <button id="l-en" data-l="en">English</button>
      </div>
    </div>

    <div class="tabs">
      <button data-m="burger"></button>
      <button data-m="fries"></button>
    </div>

    <!-- اختيار العيش (ساندوتش) أو حجم الطبق (بطاطس) -->
    <div class="buns" id="buns"></div>

    <div class="stage"><div class="stack" id="stack"></div></div>
    <p class="hint" id="hint"></p>

    <div class="grid" id="grid"></div>
  </div>

  <div class="bar">
    <button class="cta" id="cta" disabled>
      <span id="ctat"></span>
      <span id="tot"></span>
    </button>
  </div>

  <div class="done" id="done">
    <div class="stack" id="stack2"></div>
    <p id="donet"></p>
    <button id="again"></button>
  </div>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/state.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
